<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-logo"><strong>Fluxo</strong><span>Control</span></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link"><i class="fa-solid fa-gauge"></i>Dashboard</a>
        <a href="clientes.html" class="sidebar-link"><i class="fa-solid fa-users"></i>Clientes</a>
        <a href="servicos.html" class="sidebar-link"><i class="fa-solid fa-briefcase"></i>Serviços</a>
        <a href="financeiro.html" class="sidebar-link"><i class="fa-solid fa-sack-dollar"></i>Financeiro</a>
        <a href="relatorio.html" class="sidebar-link ativo"><i class="fa-solid fa-chart-column"></i>Relatórios</a>
      </nav>
      <button class="botao-logout">LOGOUT</button>
    </aside>

    <div class="wrap">
      <div class="dashboard-topo">
        <div>
          <h1 class="pagina-titulo">Relatórios</h1>
          <p class="pagina-subtitulo">Visão anual do seu negócio</p>
          <p id="print-periodo" class="print-only"></p>
        </div>
        <div class="toolbar no-print">
          <select id="filtro-ano" class="campo-select"></select>
          <button type="button" id="btn-baixar-pdf" class="btn-ghost">⬇ Baixar PDF</button>
        </div>
      </div>

      <div id="erro" class="alert-err hidden"></div>

      <section class="resumo-grade resumo-grade-4">
        <div class="resumo-cartao">
          <p class="resumo-label">Receita total</p>
          <span id="sum-rec" class="resumo-valor valor-positivo">—</span>
        </div>
        <div class="resumo-cartao">
          <p class="resumo-label">Total despesas</p>
          <span id="sum-des" class="resumo-valor valor-negativo">—</span>
        </div>
        <div class="resumo-cartao">
          <p class="resumo-label">Lucro líquido</p>
          <span id="sum-luc" class="resumo-valor">—</span>
        </div>
        <div class="resumo-cartao">
          <p class="resumo-label">Margem média</p>
          <span id="sum-mar" class="resumo-valor">—</span>
        </div>
      </section>

      <div class="painel">
        <div class="painel-header">
          <h2 class="painel-title">Receita x despesa por mês</h2>
          <div class="chart-legenda">
            <span><i class="legenda-cor legenda-verde"></i>Receita</span>
            <span><i class="legenda-cor legenda-vermelha"></i>Despesa</span>
          </div>
        </div>
        <div id="loading-chart" class="chart-loading">Carregando…</div>
        <div id="chart-bars" class="chart-bars hidden"></div>
      </div>

      <div class="grid-2">
        <div class="painel">
          <div class="painel-header">
            <h2 class="painel-title">Resumo mensal</h2>
          </div>
          <div class="tabela-container">
            <table id="tbl-meses" class="tabela-clientes">
              <thead>
                <tr>
                  <th>Mês</th>
                  <th class="td-right">Receita</th>
                  <th class="td-right">Despesas</th>
                  <th class="td-right">Lucro</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <div class="painel">
          <div class="painel-header">
            <h2 class="painel-title">Top clientes</h2>
          </div>
          <div id="lista-clientes"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/relatorios.js"></script>
</body>

</html>
